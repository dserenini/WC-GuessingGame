server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA Routing: Fallback to index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service workers - NEVER cache + allow controlling the root scope.
    # Precisa vir antes da regra genérica de .js abaixo.
    location ~* ^/(sw|flutter_service_worker)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
    }

    # Static assets (images, fonts) - Cache for 1 year
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Core Flutter/Web files (JS, CSS, HTML, JSON) - DO NOT CACHE
    location ~* \.(?:css|js|json|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
