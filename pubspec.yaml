name: copa2026
description: World Cup 2026 Prediction App — Group Stage PWA
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # i18n
  intl: ^0.20.2

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Images
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    - .env


