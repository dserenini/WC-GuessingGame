version: '3.8'

services:
  app-bolao:
    build: 
      context: .
      args:
        - SUPABASE_URL=${SUPABASE_URL}
        - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: app-bolao-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy_network

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "81:81"      # NPM Admin Dashboard
      - "443:443"    # HTTPS
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - proxy_network

networks:
  proxy_network:
    name: proxy_network
