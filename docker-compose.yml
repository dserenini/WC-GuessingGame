services:
  app-bolao:
    build:
      context: .
      args:
        - SUPABASE_URL=${SUPABASE_URL}
        - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    image: bolao-copa:latest
    container_name: app-bolao-web
    restart: unless-stopped
    ports:
      - "8002:80"
    networks:
      - npm_default

networks:
  npm_default:
    external: true
